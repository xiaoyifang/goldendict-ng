name: Release All
concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true
env:
  prerelease: ${{ !contains(github.ref_name,'master') }}
  versionSuffix: ${{ !contains(github.ref_name,'master') && 'alpha' || 'Release' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
      - experimental
    paths-ignore:
      - 'docs/**'
      - "howto/**"
      - "*.md"
      - ".clang-format"
jobs:
  build_macOS:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15,macos-15-intel]
        qt_ver: [ 6.8.3, 6.10.3 ] # 6.8 is LTS which is relatively stable, don't dump it until next LTS.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --force --overwrite \
            bzip2 \
            create-dmg \
            hunspell \
            libiconv \
            libogg \
            libvorbis \
            libzim \
            lzip \
            ccache \
            opencc \
            fmt \
            ffmpeg@6 \
            tomlplusplus \
            xapian || true
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.qt_ver }}
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ matrix.qt_ver }}
          arch: clang_64
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech
      - name: Build
        run: |
          mkdir build_dir
          export PKG_CONFIG_PATH="`brew --prefix ffmpeg@6`/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build_dir \
            -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DWITH_FFMPEG_PLAYER=ON \
            -DWITH_QT_MULTIMEDIA=OFF \
            -DWITH_TTS=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="12.0"
          cmake --build build_dir
      - name: Package
        run: |
          cmake --install build_dir/
      - name: Print package content
        run: |
          ls -Rl ./build_dir/redist
          echo "--- .dmg files in  ---"
          ls -l *.dmg 2>/dev/null || echo "(none)"
      - name: Verify eb is bundled
        run: |
          set -euo pipefail
          APP="./build_dir/redist/GoldenDict-ng.app"
          BIN="$APP/Contents/MacOS/GoldenDict-ng"
          echo "== otool -L $BIN (eb entries) =="
          otool -L "$BIN" | grep -i eb || echo "(no eb entry in main binary link list)"
          echo "== Contents/Frameworks (eb entries) =="
          ls -1 "$APP/Contents/Frameworks" | grep -i eb || echo "(no eb dylib in Frameworks)"
          echo "== Bundled libeb*.dylib files =="
          find "$APP" -name 'libeb*.dylib' -print
          # Fail the build if eb was not deployed into the bundle.
          if ! find "$APP" -name 'libeb*.dylib' | grep -q .; then
            echo "::error::libeb.dylib was not bundled into the .app (epwing support would be broken at runtime)."
            exit 1
          fi
          echo "OK: libeb.dylib is bundled."
      - uses: actions/upload-artifact@v7
        with:
          name: macOS-${{ matrix.os }}-Qt${{ matrix.qt_ver }}
          if-no-files-found: error
          retention-days: 7
          archive: false
          path: '*.dmg'

  build_Windows:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]
        qt_ver: [ 6.8.3, 6.10.3 ]
        arch: [ win64_msvc2022_64 ]
        include:
          - arch: win64_msvc2022_64
            vs_arch: amd64
    steps:
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.arch }}
          modules: qtwebengine qtwebchannel qtpositioning qt5compat qtmultimedia qtimageformats qtspeech
          # setup-python: 'false'
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vs_arch }}
      - name: Cache pre-built vcpkg package
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-export.zip
          # Bump the key whenever the export URL in the step below changes
          key: vcpkg-export-vcpkg_260930_b3ae22aef2b857af6e80d756c13f15db12be4e8a
      - name: Auto-detect & Setup vcpkg
        id: vcpkg_setup
        shell: pwsh
        run: |
          $url = "https://github.com/xiaoyifang/goldendict-ng/releases/download/vcpkg_260930_b3ae22aef2b857af6e80d756c13f15db12be4e8a/goldendict-ng-vcpkg-export.zip"
          $zipPath = "$env:RUNNER_TEMP\vcpkg-export.zip"
          $targetDir = "$env:GITHUB_WORKSPACE\vcpkg_installed"

          # SHA512 of the export zip, must match the URL_HASH in CMakeLists.txt
          $expectedHash = "8D600B13A51CD15A31A9914F8B9E545C66C47A4184A8790B081DE9D71DC324E0669A08ACF8359147FFF3F949A352324AF7DA4448979544F1DB7502EF7F1A0EF1"

          if (Test-Path $zipPath) {
            Write-Host "==> Found cached package, skipping download."
          } else {
            Write-Host "==> No cached package found, downloading..."
            # curl with 3 retries and a 15s connect timeout
            curl.exe -f -L --retry 3 --retry-delay 3 --connect-timeout 15 -o $zipPath $url
          }

          # Decide strategy based on the download result
          $downloadSuccess = $false
          if (Test-Path $zipPath) {
            $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA512).Hash
            if ($actualHash -eq $expectedHash) {
              $downloadSuccess = $true
            } else {
              Write-Warning "==> SHA512 mismatch (corrupted or partial package), removing it."
              Remove-Item $zipPath -Force
            }
          }

          if ($downloadSuccess) {
            Write-Host "==> [Strategy A] Pre-built package downloaded, extracting..."
            7z x $zipPath "-o$targetDir" -y
            $toolchain = "$targetDir\scripts\buildsystems\vcpkg.cmake"

            # Export toolchain path via env
            "USE_TOOLCHAIN=true" >> $env:GITHUB_ENV
            "VCPKG_TOOLCHAIN_PATH=$toolchain" >> $env:GITHUB_ENV
          } else {
            Write-Warning "==> [Strategy B] Pre-built package download failed (504 or network error), falling back to CMakeLists.txt FetchContent"
            "USE_TOOLCHAIN=false" >> $env:GITHUB_ENV
          }
      - name: Build
        id: build
        run: |
          New-Item -Path './build_dir' -ItemType Directory

          $extraArgs = @()
          if ($env:USE_TOOLCHAIN -eq "true") {
            Write-Host "Using pre-built vcpkg toolchain..."
            # manifest mode must be off: vcpkg.json exists in repo root but the
            # exported package ships no vcpkg.exe to resolve manifests from.
            $extraArgs += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_TOOLCHAIN_PATH", "-DVCPKG_MANIFEST_MODE=OFF"
          } else {
            Write-Host "No pre-built toolchain, CMakeLists.txt FetchContent fallback will be used."
          }

          # RelWithDebInfo + msvc's = .pdb file beside program file.
          cmake -S . -B "./build_dir" `
            -G Ninja `
            -DCMAKE_C_COMPILER="cl.exe" -DCMAKE_CXX_COMPILER="cl.exe" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DWITH_FFMPEG_PLAYER=OFF `
            -DWITH_VCPKG_BREAKPAD=ON `
            @extraArgs
          cmake --build "./build_dir"
      - name: Package
        run: |
          cd './build_dir'
          cpack --verbose --trace
          cd ..
      - name: Move files
        shell: bash
        run: |
          namePrefix=$(basename "$(ls ./build_dir/*.7z)" .7z)

          # note the name will ensure `installer` ranked higher after sorting
          cd ./build_dir
          mv "${namePrefix}.7z" "${namePrefix}-Windows.7z"
          mv "${namePrefix}.exe" "${namePrefix}-Windows-installer.exe"
          EXE_PATH=$(find . -name "goldendict.exe" | head -n 1)
          PDB_PATH=$(find . -name "goldendict.pdb" | head -n 1)
          mv "$EXE_PATH" "./${namePrefix}-Windows-exe-only.exe"
          mv "$PDB_PATH" "./${namePrefix}-Windows-pdb.pdb"
          cd ..
          ls -R
      - uses: actions/upload-artifact@v7
        with:
          name: Windows-${{ matrix.arch }}-Qt${{ matrix.qt_ver }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ./build_dir/*.exe
            ./build_dir/*.7z
            ./build_dir/*.pdb

  generate_other_staffs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      newTag: ${{ steps.getNewTag.outputs.newTag }}
      releaseTitle: ${{steps.getReleaseTitle.outputs.releaseTitle}}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need all tags to genearte changelog
      - name: Load version from VERSION file
        run: echo "version=$(xargs < VERSION)" >> $GITHUB_ENV
      - name: Get previous tag via gh
        id: changelogTags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ '${{ env.prerelease }}' == 'true' ]]; then
            echo "This is a pre-release, finding the latest release of any kind..."
            previousTag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          else
            echo "This is a stable release, finding the latest non-prerelease..."
            previousTag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo "")
          fi

          echo "previousTag: $previousTag"
          echo "prev_tag=$previousTag" >> $GITHUB_OUTPUT

          # Build the commit range required by git-cliff (prevents the "..HEAD" error on the first release)
          if [[ -n "$previousTag" ]]; then
            echo "cliff_args=${previousTag}..HEAD" >> $GITHUB_OUTPUT
          else
            echo "cliff_args=HEAD" >> $GITHUB_OUTPUT
          fi
      - name: Build Changelog
        id: build_changelog
        uses: orhun/git-cliff-action@v4.3.0
        with:
          config: cliff.toml
          args: ${{ steps.changelogTags.outputs.cliff_args }}
        env:
          OUTPUT: changelog.txt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get changelog.txt
        run: |
          # HEREDOC must be quoted to avoid Bash substitution
          # append the branch name to the changelog
          cat <<'HEREDOC' >> changelog.txt
          Based on branch: ${{ github.ref_name }}
          HEREDOC
      - name: Print changelog.txt
        run: |
          cat changelog.txt
      - name: Get git short SHA
        id: shortSHA
        run: |
          echo "sha_short=$(git rev-parse --short=10 HEAD)" >> $GITHUB_OUTPUT
      - name: Get new tag
        id: getNewTag
        run: |
          if [[ '${{ env.prerelease }}' == 'false' ]]; then
            echo "newTag=v${{ env.version }}" >> $GITHUB_OUTPUT
          else
            echo "newTag=v${{ env.version }}_${{ env.versionSuffix }}.${{ steps.shortSHA.outputs.sha_short }}" >> $GITHUB_OUTPUT
          fi
      - name: Update metainfo.xml
        if: env.prerelease == 'false'
        env:
          TAG_NAME: ${{ steps.getNewTag.outputs.newTag }}
        run: |
          VERSION="${{ env.version }}"
          DATE=$(date +%Y-%-m-%-d)
          FILE="redist/io.github.xiaoyifang.goldendict_ng.metainfo.xml"
          REPO="${{ github.repository }}"
          
          python3 .github/workflows/scripts/update_metainfo.py "$FILE" "$VERSION" "$DATE" "$REPO" "$TAG_NAME"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to metainfo.xml"
          else
            git commit -m "Update metainfo.xml for version $VERSION [skip ci]"
            git push
          fi
      - name: Get release title
        id: getReleaseTitle
        run: |
          if [[ '${{ env.prerelease }}' == 'true' ]]
          then
            echo "releaseTitle=Daily build v${{env.version}}-${{ steps.shortSHA.outputs.sha_short }}" >> $GITHUB_OUTPUT
          else
            echo "releaseTitle=v${{ env.version }}-${{ env.versionSuffix }}.${{ steps.shortSHA.outputs.sha_short }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: changelog.txt
          if-no-files-found: error
          retention-days: 7
          archive: false
          path: ./changelog.txt

  publish:
    needs: [build_macOS, build_Windows, generate_other_staffs]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
        newTag: ${{ needs.generate_other_staffs.outputs.newTag }}
        releaseTitle: ${{ needs.generate_other_staffs.outputs.releaseTitle }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: List all files
        run: ls -R
      - name: Create new tag
        run: |
          if [[ '${{ env.prerelease }}' == 'true' ]]
          then
            gh release create '${{ env.newTag }}' \
              -t '${{ env.releaseTitle }}' \
              --target '${{ github.ref_name }}' \
              --notes-file=./changelog.txt \
              --latest=false \
              --prerelease \
              --repo ${GITHUB_REPOSITORY}
          else
            gh release create '${{ env.newTag }}' \
              -t '${{ env.releaseTitle }}' \
              --target '${{ github.ref_name }}' \
              --notes-file=./changelog.txt \
              --latest=true \
              --repo ${GITHUB_REPOSITORY}
          fi
      - name: Upload artifacts
        run: |
          gh release upload '${{ env.newTag }}' --repo ${GITHUB_REPOSITORY} --clobber \
            *.7z *.exe *.pdb *.dmg
